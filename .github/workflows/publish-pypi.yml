name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # Publishes with PyPI trusted publishing (OIDC) — no API token is stored
    # in the repo. The pypi.org project must have a trusted publisher pointing
    # at this workflow file, and the "pypi" GitHub environment holds the
    # deployment protection rules.
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"
        enable-cache: true

    - name: Build package
      run: |
        uv build

    - name: Check package
      run: |
        uv pip install --system twine
        twine check dist/*

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
